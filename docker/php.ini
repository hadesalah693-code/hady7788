expose_php = Off
variables_order = "EGPCS"

; صور العقارات: 12MB كحد أقصى للرفع المؤقت، والخدمة تفرض 5MB
upload_max_filesize = 12M
post_max_size = 32M
max_file_uploads = 20

; معالجة الصور عبر GD تحتاج ذاكرة كافية.
; على خطة Render المجانية (512MB) نستخدم 384M مع سقف 12MP في render.yaml.
memory_limit = 384M

max_execution_time = 300
max_input_time = 300

date.timezone = Africa/Cairo

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
