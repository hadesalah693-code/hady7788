services:
  - type: web
    name: aqari
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      # ---------------- التطبيق ----------------
      - key: APP_NAME
        value: "الإمداد العقارية"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # APP_URL: لا تُضبط هنا؛ يُشتق تلقائيًا من RENDER_EXTERNAL_URL داخل entrypoint.
      # أضِفها يدويًا من لوحة Render فقط إذا استخدمت دومينًا مخصصًا.
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: APP_FAKER_LOCALE
        value: ar_EG
      - key: APP_TIMEZONE
        value: Africa/Cairo
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # ---------------- قاعدة البيانات (Neon) ----------------
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # ---------------- الجلسات والكاش والطوابير ----------------
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # ---------------- التخزين ----------------
      # الصور على S3-Compatible، والملفات المؤقتة تبقى محلية (مؤقتة بطبيعتها)
      - key: FILESYSTEM_DISK
        value: local
      - key: PROPERTY_IMAGE_DRIVER
        value: local
      - key: PUBLIC_DISK_DRIVER
        value: local

      # ---------------- المدير الأول ----------------
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # خطة Free لا تدعم Pre-Deploy Command، لذلك تُشغَّل الترحيلات عند الإقلاع.
# (تم تعطيلها مؤقتاً لحين استيراد قاعدة Neon يدوياً).
      - key: RUN_MIGRATIONS
        value: "false"

      # اجعلها true في أول نشر فقط لإنشاء حساب المدير، ثم أعِدها إلى false.
      - key: RUN_ADMIN_SEEDER
        value: "false"
