<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">واجهة عقارية عصرية</title>
  <desc id="desc">مشهد معماري لمدينة ومنازل حديثة بألوان الأخضر الداكن والذهبي</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset=".52" stop-color="#0b5b56"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f5ee" stop-opacity=".42"/>
      <stop offset="1" stop-color="#0b3d3a" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4d48"/>
      <stop offset="1" stop-color="#022c2a"/>
    </linearGradient>
    <pattern id="windows" width="38" height="44" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="13" height="19" rx="2" fill="#fcd780" opacity=".72"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1100" cy="280" rx="360" ry="220" fill="url(#haze)"/>
  <circle cx="1180" cy="205" r="112" fill="#fbbf24" opacity=".12" filter="url(#blur)"/>
  <circle cx="1180" cy="205" r="65" fill="#fcd780" opacity=".72"/>

